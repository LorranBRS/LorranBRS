<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 352" width="1200" height="352" role="img" aria-label="Workito, CRM SaaS em construção: funil de vendas, leads, comunicação, propostas, atividades, dashboard, planilhas; em breve análise de documentos e de feedback">
<style>
.on{opacity:0;animation:acende 8.1s linear infinite}
